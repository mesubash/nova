[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-assistant"
description = "A macOS-first personal AI voice assistant (learning project)."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dynamic = ["version"]
dependencies = [
    "PySide6>=6.7",
    "google-genai>=3.0",
    "httpx2>=2.0",
    "python-dotenv>=1.0",
    "numpy>=2.0",
    "sounddevice>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[project.scripts]
nova = "nova.__main__:main"
nova-gui = "nova.ui.app:main"

[tool.setuptools.dynamic]
version = { attr = "nova.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
